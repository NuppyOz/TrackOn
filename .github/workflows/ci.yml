name: TrackOn CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

permissions:
  contents: read

concurrency:
  group: trackon-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Build and test
    # Keep the CI image stable while ubuntu-latest migrates to Ubuntu 26.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check SonarQube credentials
        id: sonar_config
        if: >-
          github.actor != 'dependabot[bot]' &&
          (github.ref == 'refs/heads/main' ||
           (github.event_name == 'pull_request' &&
            github.event.pull_request.head.repo.full_name == github.repository))
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        shell: bash
        run: |
          if [[ -z "${SONAR_TOKEN//[[:space:]]/}" ]]; then
            echo "::error::Falta SONAR_TOKEN. Configura el repository secret en Settings > Secrets and variables > Actions con un token de SonarQube Cloud que tenga permiso Execute Analysis. Consulta docs/sonarqube-quality-gate.md."
            exit 1
          fi

      - name: Show Docker versions
        run: |
          docker --version
          docker compose version

      - name: Build API production image
        run: |
          docker build --target runtime -f apps/api/Dockerfile -t trackon-api-ci .

      - name: Build web production image
        run: |
          docker build -f apps/web/Dockerfile -t trackon-web-ci .

      - name: Build test images
        run: |
          docker compose -f compose.test.yaml build migrate-test api-test

      - name: Start isolated test database
        run: |
          docker compose -f compose.test.yaml up -d --wait db-test

      - name: Apply database migrations
        run: |
          docker compose -f compose.test.yaml run --rm --no-deps migrate-test

      - name: Run API integration tests
        run: |
          docker rm -f trackon-api-test-coverage >/dev/null 2>&1 || true
          docker compose -f compose.test.yaml run \
            --name trackon-api-test-coverage --no-deps api-test

      - name: Extract API coverage report
        run: |
          mkdir -p apps/api/coverage
          docker cp trackon-api-test-coverage:/workspace/apps/api/coverage/lcov.info apps/api/coverage/lcov.info
          docker rm trackon-api-test-coverage
          sed -i \
            -e 's#^SF:/workspace/apps/api/#SF:apps/api/#' \
            -e 's#^SF:src/#SF:apps/api/src/#' \
            apps/api/coverage/lcov.info
          test -s apps/api/coverage/lcov.info

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.34.5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24.22.1'
          cache: pnpm

      - name: Install project dependencies
        run: pnpm install --frozen-lockfile

      - name: Run web tests and collect coverage
        run: |
          pnpm --dir apps/web run test:coverage
          test -s apps/web/coverage/lcov.info
          sed -i \
            -e 's#^SF:/workspace/apps/web/#SF:apps/web/#' \
            -e 's#^SF:src/#SF:apps/web/src/#' \
            -e 's#^SF:apps/web/src/#SF:apps/web/src/#' \
            apps/web/coverage/lcov.info
          grep '^SF:' apps/web/coverage/lcov.info | head

      - name: SonarQube Cloud analysis
        if: steps.sonar_config.outcome == 'success'
        uses: SonarSource/sonarqube-scan-action@v7
        with:
          skipSignatureVerification: false
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Cleanup test environment
        if: always()
        run: |
          docker rm -f trackon-api-test-coverage >/dev/null 2>&1 || true
          docker compose -f compose.test.yaml down -v --remove-orphans
