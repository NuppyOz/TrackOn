name: TrackOn CI

on:
  push:
    branches:
      - main
      - dev
      - chore/hardening-ci-tests

  pull_request:
    branches:
      - main
      - dev

permissions:
  contents: read

concurrency:
  group: trackon-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Show Docker versions
        run: |
          docker --version
          docker compose version

      - name: Build API production image
        run: |
          docker build \
            --target runtime \
            -f apps/api/Dockerfile \
            -t trackon-api-ci .

      - name: Build web production image
        run: |
          docker build \
            -f apps/web/Dockerfile \
            -t trackon-web-ci .

      - name: Build test images
        run: |
          docker compose \
            -f compose.test.yaml \
            build migrate-test api-test

      - name: Start isolated test database
        run: |
          docker compose \
            -f compose.test.yaml \
            up -d --wait db-test

      - name: Apply database migrations
        run: |
          docker compose \
            -f compose.test.yaml \
            run --rm --no-deps migrate-test

      - name: Run API integration tests
        run: |
          docker compose \
            -f compose.test.yaml \
            run --rm --no-deps api-test

      - name: Cleanup test environment
        if: always()
        run: |
          docker compose \
            -f compose.test.yaml \
            down -v --remove-orphans
