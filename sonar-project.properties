sonar.projectName=MULTICAS TrackOn
sonar.projectVersion=0.1.0
sonar.sourceEncoding=UTF-8
sonar.projectKey=NuppyOz_TrackOn
sonar.organization=nuppyoz


# Código fuente
sonar.sources=apps/api/src,apps/web/src

# Pruebas
sonar.tests=apps/api/test
sonar.test.inclusions=apps/api/test/**/*.test.ts

# Exclusiones generales
sonar.exclusions=**/node_modules/**,**/dist/**,apps/api/src/generated/prisma/**,**/*.d.ts,**/coverage/**

# No contar duplicación propia de los tests
sonar.cpd.exclusions=apps/api/test/**/*

# Cobertura generada por Vitest
sonar.javascript.lcov.reportPaths=apps/api/coverage/lcov.info

# Esperar el resultado del Quality Gate
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300